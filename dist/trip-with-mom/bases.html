<!DOCTYPE html>

<head>

<title>Andalousie : choisir ses bases — 8 jours, 18–26 nov.</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--coral:#e2725b;--navy:#16224a;--ink:#23283b;--muted:#6b7186;--paper:#faf7f2;--card:#fff;--line:#e8e2d8;--teal:#2e7d74}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
  header{padding:28px 20px 10px;max-width:1060px;margin:0 auto}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.15;margin:0 0 8px;color:var(--navy)}
  header p{margin:4px 0;color:var(--muted);max-width:720px}
  header p b{color:var(--ink)}
  .langrow{display:flex;gap:8px;margin:0 0 12px}
  .langrow button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
  .langrow button.on{background:var(--navy);color:#fff}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px 40px}
  #map{height:58vh;min-height:380px;border-radius:16px;border:1px solid var(--line);z-index:1;box-shadow:0 6px 24px rgba(22,34,74,.10)}
  .num-pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .num-pin span{transform:rotate(45deg)}
  .trip-dot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--teal);box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .leaflet-popup-content{font-size:14px;line-height:1.45}
  .leaflet-popup-content b{color:var(--navy)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .chip{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--navy);color:#fff}
  .chip.coral{border-color:var(--coral);color:var(--coral)}
  .chip.coral.on{background:var(--coral);color:#fff}
  h2{font-family:Georgia,serif;color:var(--navy);font-size:24px;margin:30px 0 6px}
  .sub{color:var(--muted);margin:0 0 14px}
  .splits{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:6px}
  .split{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:16px;cursor:pointer;text-align:left;font:inherit}
  .split h3{margin:0 0 4px;font-size:18px;color:var(--navy)}
  .split p{margin:6px 0;font-size:14px}
  .split .route{font-weight:700}
  .split.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral) inset}
  .badge{display:inline-block;background:var(--coral);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:2px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:14px}
  .card{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;scroll-margin-top:16px}
  .card.sel{box-shadow:0 0 0 3px var(--coral)}
  .card img{width:100%;height:190px;object-fit:cover;display:block}
  .card .body{padding:16px}
  .card h3{margin:0;font-size:21px;color:var(--navy)}
  .tag{color:var(--coral);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
  .card p{font-size:14.5px;margin:8px 0}
  .card h4{margin:14px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .card ul{margin:4px 0;padding-left:18px;font-size:14.5px}
  .card li{margin:5px 0}
  .pill{display:inline-block;background:#eef3f1;color:var(--teal);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
  .note{background:#fdf3ef;border-left:3px solid var(--coral);padding:8px 12px;font-size:13.5px;border-radius:0 8px 8px 0;margin:10px 0 0}
  .howto{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px;margin-top:8px}
  .howto h3{margin:0 0 6px;color:var(--navy)}
  .howto p,.howto li{font-size:14.5px}
  footer{color:var(--muted);font-size:13px;margin-top:26px}
  @media (max-width:640px){h1{font-size:27px}#map{height:52vh;min-height:320px}}
</style>
</head>

fr:{h1:"L'Andalousie : où poser ses valises",
intro1:"8 jours sur place, du 18 au 26 novembre (flexible jusqu'au 27). Vous atterrissez à Malaga le 18 et vous n'êtes pas obligés d'en repartir — la dernière nuit peut se passer ailleurs. L'idée : trois bases pour dormir, des excursions d'un jour qui rayonnent autour, sans refaire les valises chaque soir.",

splitsH:"Trois façons de partager 8 nuits",

howto1P:"Les trains à grande vitesse AVE/Avant relient les quatre grandes villes : Malaga–Cordoue ~55 min, Cordoue–Séville ~45 min, Malaga–Séville ~2 h (direct, via Cordoue), Malaga–Grenade ~1 h 20 sur les quelques trains Avant directs (sinon changement à Antequera, 1 h 30–3 h). Séville–Cadix prend ~1 h 40 en Media Distancia, avec arrêt à Jerez (~1 h 05 depuis Séville, ~40 min depuis Cadix). Réservez à l'avance ; pas besoin de voiture dans les villes — se garer dans les vieux quartiers est la partie pénible.",
howto2H:"La voiture fait tout le reste",
howto2P:"Villages blancs, Caminito del Rey, El Torcal, Sierra Nevada, pays des oliviers et Doñana : c'est le territoire de la voiture — les bus existent mais sont lents et rares. La bonne formule : prendre la voiture à Séville, la rendre à Grenade (ou à Malaga le dernier jour). Les routes de montagne autour de Grazalema sont étroites et sinueuses — garez-vous à l'entrée des villages et entrez à pied. Un permis de conduire international est recommandé en complément d'un permis américain pour louer en Espagne.",

intro1:"8 days on the ground, Nov 18–26 (flexible to the 27th). You land in Málaga on the 18th and you don't have to end there — the last night can be anywhere that connects well. The idea: three overnight bases, day trips radiating out, no packing every night.",
intro2:"Tap a pin or a card to see what each base unlocks. Times are typical door-to-door; check Renfe/ALSA for your exact dates.",
chipAll:"All bases",chipCity:"Cities",chipCountry:"Countryside",chipSea:"By the sea",chipClear:"✕ Clear selection",
splitsH:"Three ways to split 8 nights",
splitsSub:"Tap one to draw it on the map. All three keep the Alhambra, the sea, and the sherry country. They differ in how much countryside vs. city you get.",
basesH:"The bases",
basesSub:"Six candidates. Each card lists what you see by staying there, and what you can tick off as a day trip — no overnight needed.",
howtoH:"Getting around: trains + one car window",
howto1H:"Trains do the cities",
howto1P:"High-speed AVE/Avant trains link the big four: Málaga–Córdoba ~55 min, Córdoba–Seville ~45 min, Málaga–Seville ~2h (direct, via Córdoba), Málaga–Granada ~1h20 on the few direct Avant trains (otherwise change at Antequera, 1½–3h). Seville–Cádiz is ~1h40 by Media Distancia, stopping at Jerez (~1h05 from Seville, ~40 min from Cádiz). Book ahead; you don't want a car inside Seville or Granada — parking in the old towns is the painful part.",
howto2H:"A car does everything else",
howto2P:"White villages, Caminito del Rey, El Torcal, the Sierra Nevada, olive country and Doñana are car country — buses exist but they're slow and infrequent. The sweet spot: pick up the car in Seville, drop it in Granada (or Málaga on the last day). Mountain roads around Grazalema are narrow and winding — park at the village entrance and walk in. An International Driving Permit is the recommended companion to a US licence when renting in Spain.",
howto3H:"Buses fill the gaps",
howto3P:"ALSA runs Málaga–Granada ~1h45, very frequent, and local buses reach Nerja and Ronda. The Granada–Málaga bus is often faster than the train.",
footer:"Work in progress — Alex is sharing this draft with Monique for her comments. Alhambra tickets: book well ahead. Caminito del Rey is closed on Mondays. The Málaga Calle Larios lights switch on Nov 27, just after a Nov 26 departure. Distances and times are planning approximations.",

{id:"seville",n:1,name:"Seville",nameFr:"Séville",tag:"The big one",tagFr:"La grande",type:"city",coords:[37.3891,-5.9845],

  {name:"Cádiz",time:"~1h40",mode:"train",coords:[36.5297,-6.2927],blurb:"The sea day: Atlantic old town, Torre Tavira, seafood bars. The ocean stop that still feels like a real city.",blurbFr:"La journée mer : vieille ville atlantique, Torre Tavira, bars à fruits de mer. L'escale océane qui ressemble encore à une vraie ville."},

{id:"ronda",n:2,name:"Ronda & the white villages",nameFr:"Ronda et les villages blancs",tag:"The countryside base",tagFr:"La base à la campagne",type:"country",coords:[36.7424,-5.1667],

 alt:"Ronda, Andalusia, Spain",

];
const SPLITS=[
 {id:"A",name:"A · Classic triangle",nameFr:"A · Le triangle classique",route:"Málaga 2 → Seville 3 → Granada 3",routeFr:"Malaga 2 → Séville 3 → Grenade 3",bases:["malaga","seville","granada"],
  why:"Cities and sea, no car hassle. Trains do every transfer; rent a car for one day only if you want Ronda or El Torcal.",
  whyFr:"Villes et mer, sans tracas de voiture. Les trains font tous les transferts ; louez une voiture pour une seule journée si vous voulez Ronda ou El Torcal.",
  trade:"No countryside stay — the white villages are seen from the road or as one long day trip, not lived in. Departure day: Granada → Málaga airport ~1½h.",
  tradeFr:"Pas de séjour à la campagne — les villages blancs sont vus depuis la route ou en une longue excursion, pas vécus. Jour du départ : Grenade → aéroport de Malaga ~1 h 30."},
 {id:"B",name:"B · The Portugal model",nameFr:"B · Le modèle portugais",rec:true,route:"Seville 3 → Ronda countryside 2 → Granada 3",routeFr:"Séville 3 → campagne de Ronda 2 → Grenade 3",bases:["seville","ronda","granada"],
  why:"Your Portugal shape: one rural stay with a car, day trips radiating out, cities at both ends. Land in Málaga, train straight to Seville on day one; pick up the car in Seville, drop it in Granada.",
  whyFr:"La forme portugaise : un séjour rural avec une voiture, des excursions qui rayonnent, des villes aux deux bouts. Atterrissage à Malaga, train direct pour Séville le premier jour ; voiture prise à Séville, rendue à Grenade.",
  trade:"Málaga gets no overnight (just the airport), and Nerja becomes a stretch day trip from Granada. The sea comes via the Cádiz day trip from Seville.",
  tradeFr:"Malaga n'a pas de nuit (juste l'aéroport), et Nerja devient une excursion rallongée depuis Grenade. La mer vient par l'excursion à Cadix depuis Séville."},
 {id:"C",name:"C · Sea finish",nameFr:"C · Finir par la mer",route:"Seville 3 → Granada 2 → Cádiz 3",routeFr:"Séville 3 → Grenade 2 → Cadix 3",bases:["seville","granada","cadiz"],
  why:"Ends slow and salty: three Atlantic evenings after the Alhambra. Cádiz is the exhale, and Jerez is 40 minutes away.",
  whyFr:"Une fin lente et iodée : trois soirées atlantiques après l'Alhambra. Cadix est la respiration, et Jerez est à 40 minutes.",
  trade:"No countryside stay; Ronda and Grazalema are skipped or become a very long day trip. Departure day: train Cádiz → Seville (~1h40) and onward from there.",
  tradeFr:"Pas de séjour à la campagne ; Ronda et Grazalema sont sautées ou deviennent une très longue excursion. Jour du départ : train Cadix → Séville (~1 h 40), puis la suite depuis là."}
];
let lang=localStorage.getItem("bases-lang")||"fr";
let filter="all", selected=null;
const map=L.map("map").setView([37.25,-4.9],8);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const COLORS={city:"#16224a",country:"#7a4a1f",sea:"#2e7d74"};
const byId={}; BASES.forEach(b=>byId[b.id]=b);
const T=()=>STR[lang];
const Lname=b=>lang==="fr"?b.nameFr:b.name;
const Ltag=b=>lang==="fr"?b.tagFr:b.tag;
const Lmode=m=>lang==="fr"?(MODE_FR[m]||m):m;
const Ltrip=t=>lang==="fr"?(NAME_FR[t.name]||t.name):t.name;
let baseMarkers={}, tripMarkers=[], linkLines=[], routeLine=null;
function pinIcon(b){return L.divIcon({className:"",html:`<div class="num-pin" style="background:${COLORS[b.type]}"><span>${b.n}</span></div>`,iconSize:[30,30],iconAnchor:[15,28]});}
function popupHtml(b){return `<b>${Lname(b)}</b><br>${Ltag(b)}<br><i>${T().popupSee}</i>`;}
function tooltipHtml(d){return `${Ltrip(d._trip)} · ${d._trip.time} ${lang==="fr"?"en":""}${Lmode(d._trip.mode)} ${lang==="fr"?"depuis":"from"} ${Lname(byId[d._base])}`;}
BASES.forEach(b=>{
  const m=L.marker(b.coords,{icon:pinIcon(b),title:Lname(b)}).addTo(map);
  m.bindPopup(popupHtml(b));
  m.on("click",()=>selectBase(b.id,true));
  baseMarkers[b.id]=m;
  b.trips.forEach(t=>{
    const d=L.circleMarker(t.coords,{radius:6,weight:2,color:"#2e7d74",fillColor:"#fff",fillOpacity:1}).addTo(map);
    d.bindTooltip(tooltipHtml({ _base:b.id,_trip:t}),{direction:"top"});
    d._base=b.id; d._trip=t; tripMarkers.push(d);
  });
});
function clearLinks(){linkLines.forEach(l=>map.removeLayer(l));linkLines=[];if(routeLine){map.removeLayer(routeLine);routeLine=null;}}
function highlightTrips(baseId){tripMarkers.forEach(d=>{const on=!baseId||d._base===baseId;d.setStyle({opacity:on?1:.18,fillOpacity:on?1:.25});});}
function selectBase(id,scroll){
  selected=id; clearLinks();
  const b=byId[id];
  highlightTrips(id);
  b.trips.forEach(t=>{linkLines.push(L.polyline([b.coords,t.coords],{color:"#2e7d74",weight:1.5,dashArray:"4 6",opacity:.8}).addTo(map));});
  map.flyTo(b.coords,9,{duration:.8});
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",c.dataset.id===id));
  document.getElementById("clearSel").style.display="inline-block";
  if(scroll){const el=document.querySelector(`.card[data-id="${id}"]`); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function clearSelection(){
  selected=null; clearLinks(); highlightTrips(null);
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("sel"));
  document.getElementById("clearSel").style.display="none";
  document.querySelectorAll(".split").forEach(s=>s.classList.remove("on"));
  map.flyTo([37.25,-4.9],8,{duration:.8});
}
document.getElementById("clearSel").addEventListener("click",clearSelection);
function typeLabel(t){return t==="city"?T().cityBase:t==="country"?T().countryBase:T().seaBase;}
function renderCards(){
  const el=document.getElementById("cards"); el.innerHTML="";
  BASES.filter(b=>filter==="all"||b.type===filter).forEach(b=>{
    const fr=lang==="fr";
    const card=document.createElement("article");
    card.className="card"+(selected===b.id?" sel":""); card.dataset.id=b.id;
    card.innerHTML=`<img src="${b.img}" alt="${b.alt}" loading="lazy">
      <div class="body"><div class="tag">${Ltag(b)} · ${typeLabel(b.type)}</div>
      <h3>${b.n}. ${Lname(b)}</h3><p>${fr?b.whyFr:b.why}</p>
      <h4>${T().seeHere}</h4><p>${fr?b.seeFr:b.see}</p>
      <h4>${T().tripsH}</h4>
      <ul>${b.trips.map(t=>`<li><b>${Ltrip(t)}</b> <span class="pill">${t.time} · ${Lmode(t.mode)}</span><br>${fr?t.blurbFr:t.blurb}</li>`).join("")}</ul>
      <h4>${T().getH}</h4><p>${fr?b.getFr:b.get}</p>
      <div class="note">${fr?b.noteFr:b.note}</div></div>`;
    card.addEventListener("click",()=>selectBase(b.id,false));
    el.appendChild(card);
  });
}
function renderSplits(){
  const el=document.getElementById("splits"); el.innerHTML="";
  SPLITS.forEach(s=>{
    const fr=lang==="fr";
    const b=document.createElement("button");
    b.className="split"; b.dataset.split=s.id;
    b.innerHTML=`<h3>${fr?s.nameFr:s.name}${s.rec?`<span class="badge">${T().rec}</span>`:""}</h3>
      <p class="route">${fr?s.routeFr:s.route}</p><p>${fr?s.whyFr:s.why}</p><p><b>${T().tradeLbl}</b>${fr?s.tradeFr:s.trade}</p>`;
    b.addEventListener("click",()=>{
      document.querySelectorAll(".split").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      clearLinks(); highlightTrips(null);
      document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",s.bases.includes(c.dataset.id)));
      const pts=s.bases.map(id=>byId[id].coords);
      routeLine=L.polyline(pts,{color:"#e2725b",weight:3,opacity:.9}).addTo(map);
      map.flyToBounds(L.latLngBounds(pts).pad(.35),{duration:.8});
    });
    el.appendChild(b);
  });
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(n=>{const k=n.dataset.i18n; if(T()[k]!==undefined) n.textContent=T()[k];});
  document.getElementById("langFr").classList.toggle("on",lang==="fr");
  document.getElementById("langEn").classList.toggle("on",lang==="en");
  renderCards(); renderSplits();
  BASES.forEach(b=>{
    baseMarkers[b.id].setPopupContent(popupHtml(b));
    baseMarkers[b.id].options.title=Lname(b);
  });
  tripMarkers.forEach(d=>d.setTooltipContent(tooltipHtml(d)));
  if(selected) document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",c.dataset.id===selected));
}
document.getElementById("langFr").addEventListener("click",()=>{lang="fr";localStorage.setItem("bases-lang","fr");applyLang();});
document.getElementById("langEn").addEventListener("click",()=>{lang="en";localStorage.setItem("bases-lang","en");applyLang();});
document.querySelectorAll("#chips .chip[data-filter]").forEach(ch=>{
  ch.addEventListener("click",()=>{
    document.querySelectorAll("#chips .chip[data-filter]").forEach(c=>c.classList.remove("on"));
    ch.classList.add("on");
    filter=ch.dataset.filter;
    renderCards();
    BASES.forEach(b=>{
      const show=filter==="all"||b.type===filter;
      if(show) baseMarkers[b.id].addTo(map); else map.removeLayer(baseMarkers[b.id]);
    });
    tripMarkers.forEach(d=>{const show=filter==="all"||byId[d._base].type===filter; if(show) d.addTo(map); else map.removeLayer(d);});
    clearSelection();
  });
});
applyLang();
</script>
</body>
</html>
