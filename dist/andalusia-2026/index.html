:root{--bg:#f4f7f5;--surface:#fff;--ink:#102725;--muted:#536562;--line:#cbd8d3;--deep:#173e3a;--accent:#d85f45;--radius:20px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:#183f3b}
.gate::before{content:"";position:absolute;inset:0;background:url("https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Granada_-_View_from_Mirador_de_San_Nicol%C3%A1s_-_02.jpg/1920px-Granada_-_View_from_Mirador_de_San_Nicol%C3%A1s_-_02.jpg") center/cover;opacity:.55}
.gate::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,23,22,.25),rgba(9,23,22,.72))}
.gate-card{position:relative;z-index:2;width:min(480px,100%);background:rgba(255,255,255,.96);border-radius:28px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
@media (prefers-color-scheme:dark){.gate-card{background:rgba(19,35,33,.97);color:#eef6f2}.gate-card p{color:#afc1bb}.gate-card input{background:#0c1817;color:#eef6f2;border-color:#31504a}}
.gate-card .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:800;color:var(--accent)}
.gate-card h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.1rem;line-height:1.05;margin:.2em 0 .3em;font-weight:800}
.gate-card p{color:var(--muted);margin:.4em 0 1.2em}
.gate-card label{display:block;text-align:left;font-weight:700;font-size:.9rem;margin-bottom:6px}
.gate-card input{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);font-size:1.05rem;background:#fff;color:var(--ink);outline:none}
.gate-card input:focus{border-color:var(--deep);box-shadow:0 0 0 3px rgba(23,62,58,.15)}
.gate-card button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:var(--deep);color:#fff;font-weight:800;font-size:1rem}
.gate-card button:disabled{opacity:.6}
.gate-error{display:none;margin-top:12px;color:#b3261e;font-weight:700;font-size:.9rem}
.gate-error.show{display:block}
.gate-hint{font-size:.82rem;margin-top:16px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#app{display:none}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <p class="eyebrow">Voyage · Novembre 2026</p>
    <h1>Andalousie 2026</h1>
    <p>Alex &amp; Monique — le voyage est derrière ce mot de passe.<br><span lang="en">Alex &amp; Monique — the trip is behind this passphrase.</span></p>
    <form id="gateForm">
      <label for="pw">Mot de passe / Passphrase</label>
      <input id="pw" name="passphrase" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="gateBtn">Ouvrir le voyage · Open the trip</button>
      <p class="gate-error" id="gateError">Mot de passe incorrect. / Wrong passphrase.</p>
    </form>
    <p class="gate-hint">C'est le même mot de passe que pour le tableau de bord. / Same passphrase as the dashboard.</p>
  </div>
</div>
<div id="app"></div>

function b64ToBytes(s){const bin=atob(s.replace(/-/g,"+").replace(/_/g,"/"));const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
function bytesToB64(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
async function deriveKey(passphrase,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(passphrase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function tryUnlock(passphrase){
  const salt=b64ToBytes(PAYLOAD.salt), iv=b64ToBytes(PAYLOAD.iv), ct=b64ToBytes(PAYLOAD.ct);
  const key=await deriveKey(passphrase,salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  localStorage.setItem("and2026-key",bytesToB64(new Uint8Array(await crypto.subtle.exportKey("raw",key))));
  return new TextDecoder().decode(pt);
}
function fmt(amount,cur){
  const usd=amount*TO_USD[cur];
  const disp=state.cur==="USD"?usd:usd*1.4113;
  const locale=state.lang==="fr"?"fr-CA":"en-CA";
  return new Intl.NumberFormat(locale,{style:"currency",currency:state.cur,maximumFractionDigits:disp%1===0?0:2}).format(disp);
}
function renderPrices(){
  document.querySelectorAll(".price").forEach(function(el){
    const amount=parseFloat(el.dataset.amount), cur=el.dataset.cur, kind=el.dataset.kind||"total";
    const pp=state.lang==="fr"?"p.p.":"pp";
    if(kind==="total"){
      el.innerHTML=fmt(amount,cur)+' <span class="pp">('+fmt(amount/2,cur)+" "+pp+")</span>";
    }else{
      el.textContent=fmt(amount,cur);
    }
  });
  const cats={};
  let grand=0;
  document.querySelectorAll("[data-budget]").forEach(function(el){
    const usd=parseFloat(el.dataset.amount)*TO_USD[el.dataset.cur];
    cats[el.dataset.budget]=(cats[el.dataset.budget]||0)+usd; grand+=usd;
  });
  document.querySelectorAll("tr.catline").forEach(function(tr){
    const cell=tr.querySelector(".cat-total");
    if(cell) cell.textContent=fmt(cats[tr.dataset.cat]||0,"USD");
  });
  const gt=document.getElementById("grand-total");
  if(gt) gt.textContent=fmt(grand,"USD");
  const set=function(id,v){const e=document.getElementById(id);if(e)e.textContent=v;};
  set("kpi-total",fmt(grand,"USD"));
  set("kpi-pp",fmt(grand/2,"USD"));
  set("kpi-day",fmt(grand/2/13,"USD"));
}
function applyLang(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    if(el._fr===undefined) el._fr=el.innerHTML;
    const v=state.lang==="fr"?el._fr:(EN[el.dataset.i18n]||el._fr);
    el.innerHTML=v;
  });
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===state.lang));});
  buildNavChips();
  renderPrices();
}

function navChip(dLine,pLine,target,ariaLabel){
  const b=document.createElement("button");

  const d=document.createElement("span"); d.className="d"; d.textContent=dLine;
  const p=document.createElement("span"); p.className="p"; p.textContent=pLine;
  b.appendChild(d); b.appendChild(p);

  nav.innerHTML="";
  nav.appendChild(navChip(navT("Le voyage","nav.ovd"),navT("Aperçu","nav.overview"),"#apercu",navT("Aperçu","nav.overview")));
  NAV.forEach(function(g){
    const d=navT(g[0],g[1]), p=navT(g[2],g[3]);
    nav.appendChild(navChip(d,p,g[4],d+" · "+p));
  });
  nav.appendChild(navChip(navT("Dépenses","nav.bud"),navT("Budget","nav.budget"),"#budget",navT("Budget","nav.budget")));
  const restore=prevTarget?document.querySelector('.navchip[data-target="'+prevTarget+'"]'):null;
  setActiveChip(restore||nav.querySelector(".navchip"));
}
function initNavSpy(){
  if(navObserver) navObserver.disconnect();
  const seen={}, targets=[];
  ["#apercu"].concat(NAV.map(function(g){return g[4];})).concat(["#budget"]).forEach(function(s){
    if(!seen[s]){ seen[s]=true; targets.push(s); }
  });
  const els=targets.map(function(s){return document.querySelector(s);}).filter(Boolean);
  navObserver=new IntersectionObserver(function(entries){
    let best=null;
    entries.forEach(function(e){
      if(e.isIntersecting && (!best || e.boundingClientRect.top<best.boundingClientRect.top)) best=e;
    });
    if(best){
      const chip=document.querySelector('.navchip[data-target="#'+best.target.id+'"]');
      if(chip) setActiveChip(chip);
    }
  },{rootMargin:"-152px 0px -55% 0px"});
  els.forEach(function(el){navObserver.observe(el);});
}
function init(){
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click",function(){state.lang=b.dataset.lang;applyLang();});
  });
  document.querySelectorAll("[data-cur]").forEach(function(b){
    b.addEventListener("click",function(){
      state.cur=b.dataset.cur;
      document.querySelectorAll("[data-cur]").forEach(function(x){x.setAttribute("aria-pressed",String(x.dataset.cur===state.cur));});
      renderPrices();
    });
  });
  const lock=document.getElementById("lockBtn");
  if(lock) lock.addEventListener("click",function(){localStorage.removeItem("and2026-key");location.reload();});
  applyLang();
  initNavSpy();
}
function showContent(html){
  document.getElementById("gate").style.display="none";
  const app=document.getElementById("app");
  app.innerHTML=html;
  app.style.display="block";
  init();
}
async function unlockWithKey(){
  try{
    const raw=localStorage.getItem("and2026-key");
    if(!raw) return false;
    const key=await crypto.subtle.importKey("raw",b64ToBytes(raw),{name:"AES-GCM",length:256},true,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(PAYLOAD.iv)},key,b64ToBytes(PAYLOAD.ct));
    showContent(new TextDecoder().decode(pt));
    return true;
  }catch(e){ localStorage.removeItem("and2026-key"); return false; }
}
document.getElementById("gateForm").addEventListener("submit",async function(ev){
  ev.preventDefault();
  const btn=document.getElementById("gateBtn");
  const err=document.getElementById("gateError");
  const card=document.getElementById("gateCard");
  btn.disabled=true; err.classList.remove("show");
  try{
    const html=await tryUnlock(document.getElementById("pw").value);
    showContent(html);
  }catch(e){
    err.classList.add("show");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    btn.disabled=false;
    document.getElementById("pw").select();
  }
});
unlockWithKey();
</script>
