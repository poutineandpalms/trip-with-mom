:root{--bg:#f4f7f5;--surface:#fff;--ink:#102725;--muted:#536562;--line:#cbd8d3;--deep:#173e3a;--accent:#d85f45;--radius:20px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:#183f3b}
.gate::before{content:"";position:absolute;inset:0;background:url("https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Granada_-_View_from_Mirador_de_San_Nicol%C3%A1s_-_02.jpg/1920px-Granada_-_View_from_Mirador_de_San_Nicol%C3%A1s_-_02.jpg") center/cover;opacity:.55}
.gate::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,23,22,.25),rgba(9,23,22,.72))}
.gate-card{position:relative;z-index:2;width:min(480px,100%);background:rgba(255,255,255,.96);border-radius:28px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
@media (prefers-color-scheme:dark){.gate-card{background:rgba(19,35,33,.97);color:#eef6f2}.gate-card p{color:#afc1bb}.gate-card input{background:#0c1817;color:#eef6f2;border-color:#31504a}}
.gate-card .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:800;color:var(--accent)}
.gate-card h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.1rem;line-height:1.05;margin:.2em 0 .3em;font-weight:800}
.gate-card p{color:var(--muted);margin:.4em 0 1.2em}
.gate-card label{display:block;text-align:left;font-weight:700;font-size:.9rem;margin-bottom:6px}
.gate-card input{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);font-size:1.05rem;background:#fff;color:var(--ink);outline:none}
.gate-card input:focus{border-color:var(--deep);box-shadow:0 0 0 3px rgba(23,62,58,.15)}
.gate-card button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:var(--deep);color:#fff;font-weight:800;font-size:1rem}
.gate-card button:disabled{opacity:.6}
.gate-error{display:none;margin-top:12px;color:#b3261e;font-weight:700;font-size:.9rem}
.gate-error.show{display:block}
.gate-hint{font-size:.82rem;margin-top:16px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#app{display:none}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <p class="eyebrow">Voyage · Novembre 2026</p>
    <h1>Andalousie 2026</h1>
    <p>Alex &amp; Monique — le voyage est derrière ce mot de passe.<br><span lang="en">Alex &amp; Monique — the trip is behind this passphrase.</span></p>
    <form id="gateForm">
      <label for="pw">Mot de passe / Passphrase</label>
      <input id="pw" name="passphrase" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="gateBtn">Ouvrir le voyage · Open the trip</button>
      <p class="gate-error" id="gateError">Mot de passe incorrect. / Wrong passphrase.</p>
    </form>
    <p class="gate-hint">C'est le même mot de passe que pour le tableau de bord. / Same passphrase as the dashboard.</p>
  </div>
</div>
<div id="app"></div>

"d18.t":"Arriving in Málaga",
"d18.b":"We land at 12:20. Taxi to the hotel (about €25, 20 minutes), settle in, then wander the old town: the cathedral, Calle Larios, and the harbour at sunset.",
"d19.t":"Morning in Málaga, then the train to Seville",
"d19.b":"A slow morning: the Alcazaba and its gardens, or the Picasso Museum if we'd rather stay out of the heat. Train to Seville in the early afternoon (about 2 hours, €20–35 per person booked early). Arrive in Seville, settle in, then a first evening in the Santa Cruz quarter.",
"ideas.link":"Official site ↗",

"ma.i1t":"Picasso Museum",
"ma.i1":"The collection in the Buenavista Palace, in the artist's home town. About €13.",
"ma.i2t":"The Alcazaba",
"ma.i2":"The Moorish fortress above the city, with gardens and a fine view over the harbour. Go in the morning, at our own pace.",
"se.nights":"3 nights · Nov 19–22",
"se.name":"Seville",
"se.dates":"Thursday, November 19 → Sunday, November 22",
"se.f1t":"To taste","se.f1":"Tapas in Triana, a chilled fino, and the oranges — this is the city of orange trees.",
"se.f2t":"Don't miss","se.f2":"Plaza de España at sunset, and a flamenco show one evening.",
"se.f3t":"Good to know","se.f3":"The cathedral is the largest Gothic cathedral in the world. The whole historic centre is walkable.",
"se.stays.t":"Where we sleep — pick one, only one will be kept",
"se.stays.intro":"Three places are booked for the same nights, all in the Santa Cruz quarter, a few minutes from the cathedral. We pick one and cancel the other two before the deadlines below.",
"se.sm.room":"Apartment with balcony, double bed",
"se.sm.pay":"Pay at property, €0 paid",
"se.sm.cx":"Until Fri, Nov 13, 11:59 PM (local time)",
"se.sm.note":"A real apartment with kitchen and balcony, 5–6 minutes on foot from the Alcázar. Host: +34 717 10 33 31.",
"se.cc.room":"Superior Double Room, 2 twin beds, courtyard view",
"se.cc.pay":"Nov 4 — refunded if cancelled",
"se.cc.cx":"Until Sat, Nov 14, 6:00 PM (local time)",
"se.cc.note":"Steps from the sights: the Alcázar 97 m away, the cathedral 98 m. Lift, rooftop terrace with cathedral views, daily housekeeping.",
"se.md.room":"Superior Double Room",
"se.md.pay":"Pay at property, cash only",
"se.md.cx":"Until Mon, Nov 16, 11:59 PM (local time)",
"se.md.note":"Adults-only hotel. Reception is not open 24 hours — we must tell them our arrival time in advance. Alex's favourite so far.",
"d20.t":"The heart of Seville",
"d20.b":"The cathedral and the Giralda in the morning, then the Alcázar and its gardens. In the afternoon, the Feria del Belén (the nativity-scene Christmas market) and a stroll in Triana. In the evening, a flamenco show.",
"d20.tix":"Book ahead: Alcázar €15.50, cathedral €13 online. Flamenco, €18–45.",
"d21.t":"Day trip — Jerez and Cádiz",
"d21.b":"Train from Seville Santa Justa to Jerez (about 1 hour), small-group sherry tasting (2 h 30: 5 sherries and 1 brandy, about $112 per person), then Cádiz for a walk by the sea, and train back to Seville. We don't have the rental car yet, so the train is the way there.",
"d22.t":"Pick up the car, drive to Ronda",
"d22.b":"We pick up the rental car in Seville and drive about 2 hours to Ronda, through the hills. On the way, a stop at LA Almazara, the olive oil mill designed by Philippe Starck: guided tour at 12:30 (1 h 30, museum, mill, olive grove and tasting — the 10:30 tour doesn't fit the drive from Seville). Arrive in the early afternoon, settle in, then the Puente Nuevo at sunset.",
"se.i1t":"The Real Alcázar",
"se.i1":"The royal palace, still lived in, with its patios and gardens. €15.50 — book ahead.",
"se.i2t":"The Cathedral and the Giralda",
"se.i2":"The largest Gothic cathedral in the world, and its tower, climbed by ramps, not stairs. €13 online.",
"se.i3t":"Plaza de España",
"se.i3":"The great half-moon square in María Luisa Park, free, beautiful at sunset.",
"ro.nights":"2 nights · Nov 22–24",
"ro.dates":"Sunday, November 22 → Tuesday, November 24",
"ro.f1t":"To taste","ro.f1":"Ronda wines and Sierra chestnuts — it's the season.",
"ro.f2t":"Don't miss","ro.f2":"The Puente Nuevo above the 100-metre gorge, at sunset.",
"ro.f3t":"Good to know","ro.f3":"The town is split in two by the El Tajo gorge. Our apartment has a terrace right above it.",
"ro.room":"Two-bedroom apartment, balcony and terrace over the gorge",
"ro.pay":"Pay at property, by card (no cash)",
"ro.cx":"Until Mon, Nov 16, 11:59 PM (local time)",
"ro.note":"Check-in 2:00–10:00 PM, door-code entry. Tell the host our arrival time. To confirm: step-free access from the street to the lift.",
"d23.t":"The white villages",
"d23.b":"By car, the white-village loop: Grazalema, Zahara de la Sierra with its castle, and Setenil de las Bodegas, the village built under the rock. We drive gently, stop for a coffee, and come back for sunset over the gorge.",
"d24.t":"Drive to Granada, sunset in the Albaicín",
"d24.b":"We leave Ronda in the morning and drive about 2.5 hours to Granada. Check in, then up to the Albaicín for sunset from the Mirador de San Nicolás — the finest view of the Alhambra.",
"ro.i1t":"The Puente Nuevo and the gorge",
"ro.i1":"The 18th-century bridge, 98 metres above the river. The path below the bridge gives the best photo.",
"gr.nights":"2 nights · Nov 24–26",
"gr.name":"Granada",
"gr.dates":"Tuesday, November 24 → Thursday, November 26",
"gr.f1t":"To taste","gr.f1":"In Granada, every drink comes with a free tapa. And piononos, the little cakes from Santa Fe.",
"gr.f2t":"Don't miss","gr.f2":"The Alhambra on the 25th, with the Generalife gardens at golden hour.",
"gr.f3t":"Good to know","gr.f3":"Granada was the last Muslim kingdom in Spain, until 1492. The Alhambra closes at 6 PM in winter.",
"gr.room":"Standard Double Room, courtyard side",
"gr.pay":"Auto-charged Nov 18",
"gr.cx":"Until Nov 21, 12:01 AM (local time)",
"gr.note":"A charming small hotel two steps from the cathedral. Expedia itinerary 73580531109239.",
"d25.t":"The Alhambra — the big day",
"d25.b":"We go up by taxi or bus, not on foot — the hill is steep. The Alcazaba first, then the Nasrid Palaces at <b>3:00 PM sharp</b> (that's the time on our tickets, we can't be late), and we finish with the Generalife gardens at golden hour. Sunset is at 5:59 PM and the site closes at 6 PM.",
"d25.tix.t":"Our tickets:",
"d25.tix.b":"Alhambra + Rodríguez-Acosta Foundation, €25.45 per person. Bring your passports — tickets are named and the names must match. The ticket also includes the guided visit of the Rodríguez-Acosta studio house.",
"d26.t":"Drive to the airport, then Zurich",
"d26.b":"A quiet morning in Granada, then back in the car: about 1.5 hours to Málaga airport. We drop the car and fly at 4:20 PM to Zurich. We land at 7 PM — just in time for the Christmas markets.",
"gr.i1t":"The Nasrid Palaces",
"gr.i1":"The Court of the Lions, the Court of the Myrtles, the Hall of the Ambassadors — the heart of the Alhambra. Included in our tickets for the 25th.",
"gr.i2t":"The Generalife",
"gr.i2":"The sultans' summer gardens, with pools and hedges. We save them for the end of the day, in the golden light.",
"gr.i4t":"The Albaicín and Sacromonte",
"gr.i4":"The white lanes of the Albaicín and the cave houses of Sacromonte, above the city. Free, on foot from the hotel.",
"zu.nights":"1 night · Nov 26–27",
"zu.dates":"Thursday, November 26 → Friday, November 27",
"zu.f1t":"To taste","zu.f1":"Fondue, mulled wine, and the finest hot chocolate in Europe.",
"zu.f2t":"Don't miss","zu.f2":"The Christmas markets, all open — we arrive the same evening, they close at 10 PM.",
"zu.f3t":"Good to know","zu.f3":"The train from the airport to the city centre takes 10 minutes, every 10 minutes. The ticket is CHF 7.20.",
"zu.stays.t":"Where we sleep — pick one, only one will be kept",
"zu.stays.intro":"Two options for the same night: the airport hotel, a 5-minute walk from the terminal, or a hotel in the middle of the old town, among the markets. The choice depends on what we prefer on Friday morning: already being at the airport, or waking up in the old town.",
"zu.hp.room":"Twin Room (2 beds)",
"zu.hp.total":"CHF 205 + CHF 7 city tax",
"zu.hp.pay":"Pay at property, CHF 0 paid",
"zu.hp.cx":"Until Wed, Nov 25, 11:59 PM (local time)",
"zu.hp.note":"5 minutes on foot from the terminal through The Circle's covered walkway — and from the airport station. The simplest option for the 5:15 PM flight on Friday.",
"zu.fz.room":"Superior Studio, city view",
"zu.fz.pay":"Pay later, CHF 0 paid",
"zu.fz.cx":"Until Tue, Nov 24, 11:59 PM (local time)",
"zu.fz.note":"Right in the old town, on the very street of the Dörfli Christmas market. Note: its cancellation deadline is a day earlier than the Hyatt's — we must decide before Monday, November 23.",
"d26b.t":"Evening at the Christmas markets",
"d26b.b":"We land at 7 PM. Train into town (10 minutes), drop the bags, and walk: the covered market in the station (Polarzauber, open until 10 PM), the old town, and the big open-air market in front of the Opera House (Bellevue Noël, open until 10 PM too). A mulled wine, a fondue if we're hungry, and to bed — it's been a long day.",
"d27.t":"Morning in Zurich, then across the Atlantic",
"d27.b":"A quiet morning: the old town, the markets opening at 11 AM, a hot chocolate by the Limmat. We take the train back to the airport in the early afternoon — the flight to Newark leaves at 5:15 PM.",
"zu.mk.t":"The Christmas markets — opening hours",
"zu.mk.intro":"All open November 19 to December 23 or 24. The five are walkable in a single stroll from north to south: from the station down to the lake.",
"zu.mk1t":"Polarzauber, main station",
"zu.mk1":"The big covered market, about 140 stalls under the glass roof, with the Swarovski crystal tree. Sun–Wed 11 AM – 9 PM, Thu–Sat 11 AM – 10 PM.",
"zu.mk2t":"Bellevue Noël, Sechseläutenplatz",
"zu.mk2":"The largest open-air market, in front of the Opera House by the lake — fondue chalets and a food village. Mon–Sat 11 AM – 10 PM, Sun 11 AM – 8 PM.",
"zu.mk3t":"Dörfli, Niederdorf",
"zu.mk3":"The city's oldest market, in the old town lanes. Mon–Thu 11 AM – 9 PM, Fri–Sat 11 AM – 10 PM, Sun 11 AM – 8 PM.",
"zu.mk4t":"Münsterhof",
"zu.mk4":"The most elegant small market, beside the Fraumünster church — local makers and Zurich brands. Mon–Sat 11 AM – 9:30 PM, Sun 11 AM – 7:30 PM.",
"zu.mk5t":"The Singing Christmas Tree, Werdmühleplatz",
"zu.mk5":"A choir singing carols from inside a giant illuminated tree. Mon–Thu 4 – 9 PM, Fri 4 – 10 PM, Sat 1 – 10 PM, Sun 1 – 9 PM. Choirs sing at 5:30 and 6:30 PM.",
"nw.nights":"1 night · Nov 27–28",
"nw.dates":"Friday, November 27 → Saturday, November 28",
"nw.f1t":"The plan",
"nw.f1":"We land at 8:30 PM, the hotel shuttle is waiting, we sleep, and we leave the next morning — each to our own home.",
"nw.f2t":"Good to know",
"nw.f2":"Free hotel shuttle and hot breakfast included. Pick-up: Zone 2, Station P3 on the AirTrain.",
"nw.room":"2 queen beds, 2 adults",
"nw.pay":"Pay at property",
"nw.cx":"Until Thu, Nov 26, 11:59 PM (local time)",
"d28.t":"We part ways — each heading home",
"d28.b":"Breakfast at the hotel, shuttle to the airport. Mom flies at 11:36 AM to Ottawa (Terminal C), Alex at 11:59 AM to Orlando (Terminal A). We clear security together in Terminal C, then Alex takes the airside shuttle to Terminal A.",

"ma.o1t":"Málaga Cathedral",
"ma.o1":"The Renaissance cathedral with its carved choir stalls, nicknamed 'La Manquita' because one tower was never finished.",
"ma.o2t":"Gibralfaro Castle",
"ma.o2":"The best panorama in the city: the port, the bullring and the coast. The climb is steep, so take a taxi or bus up.",
"ma.o3t":"Centre Pompidou Málaga",
"ma.o3":"Modern art from the Paris collection under the rainbow glass cube, right on the harbour.",
"ma.o4t":"Atarazanas Market",
"ma.o4":"The 19th-century market hall in a former Nasrid shipyard, with a huge stained-glass window. Mornings only, closed Sundays.",
"ma.o5t":"Carmen Thyssen Museum",
"ma.o5":"Spanish 19th-century painting in a lovely old palace, quieter than the Picasso Museum.",
"ma.o6t":"Museo de Málaga",
"ma.o6":"Archaeology and fine art in the old customs house. Free for EU citizens.",
"ma.o7t":"Plaza de la Merced",
"ma.o7":"The lively square with Picasso's statue, and his small birthplace house to visit.",
"ma.o8t":"La Malagueta beach",
"ma.o8":"The flat seafront stroll east of the port, with sardine skewers at the beach restaurants.",
"ma.o9t":"La Concepción Botanical Garden",
"ma.o9":"A historic tropical botanical garden, a calm green break. A short taxi or bus ride from the centre.",
"se.o1t":"Casa de Pilatos",
"se.o1":"A quieter Mudéjar-Renaissance palace with beautiful tiled courtyards, the best 'second palace' after the Alcázar.",
"se.o2t":"Palacio de las Dueñas",
"se.o2":"The Dukes of Alba family home with beautiful gardens, much calmer than the Alcázar.",
"se.o3t":"Metropol Parasol",
"se.o3":"The giant wooden structure with a rooftop walkway. Best at sunset, with the light show after dark.",
"se.o4t":"Museo de Bellas Artes",
"se.o4":"One of Spain's finest art museums (Murillo, Zurbarán, Velázquez) in a former convent.",
"se.o5t":"Guadalquivir river cruise",
"se.o5":"A gentle one-hour boat ride past the Torre del Oro and Triana, a restful way to see the city from the water.",
"se.o6t":"Torre del Oro",
"se.o6":"The 13th-century riverside tower with a small maritime museum and a flat, easy promenade.",
"se.o7t":"Iglesia del Salvador",
"se.o7":"A Baroque church on a lively square, 5 minutes from the Cathedral, far less crowded.",
"se.o8t":"María Luisa Park",
"se.o8":"The shady, flat park adjoining Plaza de España, a perfect slow stroll with fountains and tiled benches.",
"se.o9t":"Centro Cerámica Triana",
"se.o9":"The small ceramics museum in the old Triana tile factory, a nice complement to the Triana walk.",
"se.o10t":"Archivo de Indias",
"se.o10":"The UNESCO-listed archive of the Spanish Americas with a free exhibition, right beside the Cathedral.",
"ro.o1t":"Ronda's bullring",
"ro.o1":"The 1785 bullring, one of Spain's oldest. The museum is the real draw.",
"ro.o2t":"Palacio de Mondragón",
"ro.o2":"A Moorish-Gothic-Renaissance palace housing the town museum, with a water garden echoing the Alhambra.",
"ro.o3t":"The Arab Baths",
"ro.o3":"Among the best-preserved 13th-century Moorish baths in Spain, down by the old river quarter.",
"ro.o4t":"Iglesia de Santa María la Mayor",
"ro.o4":"Ronda's main church on the old-town square, with a rooftop walk for gorge views.",
"ro.o5t":"Jardines de Cuenca",
"ro.o5":"Terraced gardens on the gorge rim with the classic Puente Nuevo photo angle.",
"ro.o6t":"Mirador de Aldehuela",
"ro.o6":"The postcard viewpoint of the bridge and gorge, an easy flat walk from the Alameda.",
"ro.o7t":"Casa del Rey Moro",
"ro.o7":"A Moorish palace with hanging gardens over the gorge. La Mina, the water-mine stairway, is 231 steep steps, so the gardens alone are the comfortable option.",
"ro.o8t":"Casa Museo Don Bosco",
"ro.o8":"A small modernist house with pretty gardens and gorge views, a quiet 20-minute stop.",
"ro.o9t":"Alameda del Tajo",
"ro.o9":"The flat clifftop park promenade with balconies over the gorge, ideal for a slow sunset wander.",
"ro.o10t":"Bodega Descalzos Viejos",
"ro.o10":"A Ronda winery in a 16th-century convent just outside town. Book a tasting to try the local Sierras de Málaga wines.",
"gr.o1t":"Granada Cathedral and Royal Chapel",
"gr.o1":"The Renaissance cathedral beside the tombs of Ferdinand and Isabella, the two together take about an hour.",
"gr.o2t":"Monasterio de la Cartuja",
"gr.o2":"Plain outside, one of the most extravagant Baroque sacristies in Spain inside, and the quietest of Granada's big interiors.",
"gr.o3t":"Monasterio de San Jerónimo",
"gr.o3":"A Renaissance monastery with two cloisters, a short walk from the centre.",
"gr.o4t":"Hammam Al Ándalus",
"gr.o4":"Candlelit Arab baths near Plaza Nueva, the perfect rest for tired legs after the Alhambra. Book 2–3 days ahead.",
"gr.o5t":"El Bañuelo",
"gr.o5":"11th-century Arab baths on the Carrera del Darro, older than the Alhambra, a quick, atmospheric stop.",
"gr.o6t":"Museo Cuevas del Sacromonte",
"gr.o6":"The cave-dwelling museum explaining Sacromonte's Roma cave-house life. Taxi up the hill, no steep climb needed.",
"gr.o7t":"Corral del Carbón and the Alcaicería",
"gr.o7":"A 14th-century Nasrid caravanserai (free, 5 minutes) next to the old silk market lanes.",
"gr.o8t":"Carmen de los Mártires gardens",
"gr.o8":"Romantic gardens on the Alhambra hill with peacocks, fountains and Alhambra views. Free entry.",
"gr.o9t":"Basílica de San Juan de Dios",
"gr.o9":"A dazzling Baroque basilica a short walk from the centre, often missed by visitors.",
"gr.o10t":"Tapas crawl on Calle Navas",
"gr.o10":"Granada's famous free-tapa-with-a-drink culture, a relaxed evening hopping between bars.",
"zu.o1t":"Old Town and Niederdorf",
"zu.o1":"Medieval lanes, guild houses and fountains on both banks of the Limmat. Free and flat.",
"zu.o2t":"Lindenhof",
"zu.o2":"A quiet hilltop square with the best free viewpoint over the old town rooftops and river.",
"zu.o3t":"Fraumünster",
"zu.o3":"Five glowing Marc Chagall stained-glass windows in the choir. CHF 5, 30 minutes.",
"zu.o4t":"Grossmünster",
"zu.o4":"The twin-towered Romanesque church facing the Fraumünster across the river. The church floor alone is the comfortable option, the tower climb is narrow stairs.",
"zu.o5t":"Kunsthaus Zürich",
"zu.o5":"Switzerland's largest art museum (Monet, Munch, Giacometti, Hodler). Open Thu–Fri, closed Mondays.",
"zu.o6t":"Swiss National Museum",
"zu.o6":"Swiss history from lake dwellings to watchmaking in a turreted castle-like building right behind the main station. Closed Mondays.",
"zu.o7t":"Lake Zurich boat cruise",
"zu.o7":"A short round-trip from Bürkliplatz for city-and-lake views from the water.",
"zu.o8t":"Uetliberg",
"zu.o8":"Zurich's own mountain: the S10 train from the main station, then a short flat walk to the lookout tower for city, lake and (on a clear day) Alps views.",
"zu.o9t":"Bahnhofstrasse",
"zu.o9":"The famous shopping mile from the station to the lake, an easy flat walk with Christmas lights in season.",
"zu.o10t":"Thermalbad & Spa Zürich",
"zu.o10":"Rooftop thermal baths with city views in a converted brewery, a warm wind-down after a cold market evening (bring swimwear, book ahead).",

const NAV = [
["16–17 nov.","nav.g1d","Départ","nav.g1p","#vols"],
["18 nov.","nav.g2d","Málaga","nav.g2p","#malaga"],
["19–22 nov.","nav.g3d","Séville","nav.g3p","#seville"],
["22–24 nov.","nav.g4d","Ronda","nav.g4p","#ronda"],
["24–26 nov.","nav.g5d","Grenade","nav.g5p","#granada"],
["26–27 nov.","nav.g6d","Zurich","nav.g6p","#zurich"],
["27–28 nov.","nav.g7d","Retour","nav.g7p","#newark"]
];
function b64ToBytes(s){const bin=atob(s.replace(/-/g,"+").replace(/_/g,"/"));const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
function bytesToB64(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
async function deriveKey(passphrase,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(passphrase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function tryUnlock(passphrase){
  const salt=b64ToBytes(PAYLOAD.salt), iv=b64ToBytes(PAYLOAD.iv), ct=b64ToBytes(PAYLOAD.ct);
  const key=await deriveKey(passphrase,salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  localStorage.setItem("and2026-key",bytesToB64(new Uint8Array(await crypto.subtle.exportKey("raw",key))));
  return new TextDecoder().decode(pt);
}
function fmt(amount,cur){
  const usd=amount*TO_USD[cur];
  const disp=state.cur==="USD"?usd:usd*1.4113;
  const locale=state.lang==="fr"?"fr-CA":"en-CA";
  const num=new Intl.NumberFormat(locale,{minimumFractionDigits:disp%1===0?0:2,maximumFractionDigits:2}).format(disp);
  const sym=state.cur==="USD"?"US$":"CA$";
  return state.lang==="fr"?num+" "+sym:sym+num;
}
function renderPrices(){
  document.querySelectorAll(".price").forEach(function(el){
    const amount=parseFloat(el.dataset.amount), cur=el.dataset.cur;
    el.textContent=fmt(amount,cur);
  });
  const cats={};
  let grand=0;
  document.querySelectorAll("[data-budget]").forEach(function(el){
    const usd=parseFloat(el.dataset.amount)*TO_USD[el.dataset.cur];
    cats[el.dataset.budget]=(cats[el.dataset.budget]||0)+usd; grand+=usd;
  });
  const ppLabel=state.lang==="fr"?"par personne":"per person";
  document.querySelectorAll("tr.catline").forEach(function(tr){
    const total=cats[tr.dataset.cat]||0;
    const amt=tr.querySelector(".cat-amt"), pp=tr.querySelector(".cat-pp");
    if(amt) amt.textContent=fmt(total,"USD");
    if(pp) pp.textContent=fmt(total/2,"USD")+" "+ppLabel;
  });
  const gt=document.getElementById("grand-total");
  if(gt) gt.textContent=fmt(grand,"USD");
  const set=function(id,v){const e=document.getElementById(id);if(e)e.textContent=v;};
  set("kpi-total",fmt(grand,"USD"));
  set("kpi-pp",fmt(grand/2,"USD"));
  set("kpi-day",fmt(grand/2/13,"USD"));
}
function applyLang(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    if(el._fr===undefined) el._fr=el.innerHTML;
    const v=state.lang==="fr"?el._fr:(EN[el.dataset.i18n]||el._fr);
    el.innerHTML=v;
  });
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===state.lang));});
  buildNavChips();
  renderPrices();
}
let navObserver=null;
function setActiveChip(btn){
  document.querySelectorAll(".navchip").forEach(function(c){c.removeAttribute("aria-current");});
  if(!btn) return;
  btn.setAttribute("aria-current","true");
  const nav=document.getElementById("navchips");
  if(nav) nav.scrollTo({left: btn.offsetLeft - nav.clientWidth/2 + btn.offsetWidth/2, behavior:"auto"});
}
function navT(fr,key){return state.lang==="fr"?fr:(EN[key]||fr);}
function navChip(dLine,pLine,target,ariaLabel){
  const b=document.createElement("button");
  b.type="button"; b.className="navchip";
  const d=document.createElement("span"); d.className="d"; d.textContent=dLine;
  const p=document.createElement("span"); p.className="p"; p.textContent=pLine;
  b.appendChild(d); b.appendChild(p);
  b.dataset.target=target; b.setAttribute("aria-label",ariaLabel);
  b.addEventListener("click",function(){
    const t=document.querySelector(target);
    if(!t) return;
    setActiveChip(b);
    t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  });
  return b;
}
function buildNavChips(){
  const nav=document.getElementById("navchips");
  if(!nav) return;
  const prev=document.querySelector('.navchip[aria-current="true"]');
  const prevTarget=prev?prev.dataset.target:null;
  nav.innerHTML="";
  nav.appendChild(navChip(navT("Le voyage","nav.ovd"),navT("Aperçu","nav.overview"),"#apercu",navT("Aperçu","nav.overview")));
  NAV.forEach(function(g){
    const d=navT(g[0],g[1]), p=navT(g[2],g[3]);
    nav.appendChild(navChip(d,p,g[4],d+" · "+p));
  });
  nav.appendChild(navChip(navT("Dépenses","nav.bud"),navT("Budget","nav.budget"),"#budget",navT("Budget","nav.budget")));
  const restore=prevTarget?document.querySelector('.navchip[data-target="'+prevTarget+'"]'):null;
  setActiveChip(restore||nav.querySelector(".navchip"));
}
function initNavSpy(){
  if(navObserver) navObserver.disconnect();
  const seen={}, targets=[];
  ["#apercu"].concat(NAV.map(function(g){return g[4];})).concat(["#budget"]).forEach(function(s){
    if(!seen[s]){ seen[s]=true; targets.push(s); }
  });
  const els=targets.map(function(s){return document.querySelector(s);}).filter(Boolean);
  navObserver=new IntersectionObserver(function(entries){
    let best=null;
    entries.forEach(function(e){
      if(e.isIntersecting && (!best || e.boundingClientRect.top<best.boundingClientRect.top)) best=e;
    });
    if(best){
      const chip=document.querySelector('.navchip[data-target="#'+best.target.id+'"]');
      if(chip) setActiveChip(chip);
    }
  },{rootMargin:"-90px 0px -55% 0px"});
  els.forEach(function(el){navObserver.observe(el);});
}
function init(){
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click",function(){state.lang=b.dataset.lang;applyLang();});
  });
  document.querySelectorAll("[data-cur]").forEach(function(b){
    b.addEventListener("click",function(){
      state.cur=b.dataset.cur;
      document.querySelectorAll("[data-cur]").forEach(function(x){x.setAttribute("aria-pressed",String(x.dataset.cur===state.cur));});
      renderPrices();
    });
  });
  const ctl=document.querySelector(".ctlbar");
  if(ctl){
    const fadeCtl=function(){ctl.classList.toggle("faded",window.scrollY>70);};
    window.addEventListener("scroll",fadeCtl,{passive:true});
    fadeCtl();
  }
  applyLang();
  initNavSpy();
}
function showContent(html){
  document.getElementById("gate").style.display="none";
  const app=document.getElementById("app");
  app.innerHTML=html;
  app.style.display="block";
  init();
}
async function unlockWithKey(){
  try{
    const raw=localStorage.getItem("and2026-key");
    if(!raw) return false;
    const key=await crypto.subtle.importKey("raw",b64ToBytes(raw),{name:"AES-GCM",length:256},true,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(PAYLOAD.iv)},key,b64ToBytes(PAYLOAD.ct));
    showContent(new TextDecoder().decode(pt));
    return true;
  }catch(e){ localStorage.removeItem("and2026-key"); return false; }
}
document.getElementById("gateForm").addEventListener("submit",async function(ev){
  ev.preventDefault();
  const btn=document.getElementById("gateBtn");
  const err=document.getElementById("gateError");
  const card=document.getElementById("gateCard");
  btn.disabled=true; err.classList.remove("show");
  try{
    const html=await tryUnlock(document.getElementById("pw").value);
    showContent(html);
  }catch(e){
    err.classList.add("show");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    btn.disabled=false;
    document.getElementById("pw").select();
  }
});
unlockWithKey();
